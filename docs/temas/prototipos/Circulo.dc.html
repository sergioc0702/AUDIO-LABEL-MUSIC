<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Tema Kawaii: reproductor</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible{outline:3px solid currentColor;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; font-family: Fredoka, sans-serif; background: {{p.bg}}; color: {{p.ink}}">
  <div style="position: absolute; left: 0; right: 0; top: 40px; display: flex; justify-content: space-between; padding: 0 8px">
    <button aria-label="Cerrar reproductor" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg>
    </button>
    <button aria-label="Añadir a favoritas" aria-pressed="{{fav}}" onClick="{{toggleFav}}" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; color: {{favColor}}">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="{{favFill}}" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7.5-4.6-9.2-9A5 5 0 0 1 12 7a5 5 0 0 1 9.2 4c-1.7 4.4-9.2 9-9.2 9z"></path></svg>
    </button>
  </div>
  <div style="position: absolute; left: 60px; right: 60px; top: 46px; text-align: center">
    <h1 style="margin: 0; font-size: 25px; font-weight: 700; line-height: 1.15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{t.title}}</h1>
    <p style="margin: 0; font-size: 16px; font-weight: 500; color: {{p.sub}}">{{t.artist}}</p>
  </div>
  <button aria-label="Cambiar la posición de la canción" onClick="{{ringTap}}" style="position: absolute; left: 25px; top: 112px; width: 340px; height: 340px; display: block">
    <svg width="340" height="340" viewBox="0 0 340 340" aria-hidden="true" style="display: block">
      <circle cx="170" cy="170" r="150" fill="{{p.disc}}"></circle>
      <circle cx="170" cy="170" r="150" fill="none" stroke="{{p.ring}}" stroke-width="18"></circle>
      <circle cx="170" cy="170" r="150" fill="none" stroke="{{p.ac}}" stroke-width="18" stroke-linecap="round" stroke-dasharray="{{dash}}" transform="rotate(-90 170 170)"></circle>
      <path transform="translate({{thumbX}} {{thumbY}}) scale(1.5)" d="M0 8 C -12 -2 -10 -13 -3 -13 C 0 -13 0 -9 0 -9 C 0 -9 0 -13 3 -13 C 10 -13 12 -2 0 8 Z" fill="#ffffff" stroke="{{p.ac}}" stroke-width="2.6" stroke-linejoin="round"></path>
    </svg>
  </button>
  <div style="position: absolute; left: 55px; top: 142px; width: 280px; height: 280px; pointer-events: none">
    <dc-import name="Perrito" mood="{{mood}}" size="280" lazo="{{p.lazo}}" hint-size="280px,280px"></dc-import>
  </div>
  <div style="position: absolute; left: 302px; top: 112px; width: 72px; height: 72px; box-sizing: border-box; border: 5px solid #ffffff; border-radius: 50%; overflow: hidden; transform: rotate(8deg)">
    <svg width="62" height="62" viewBox="0 0 72 72" aria-hidden="true" style="display: block">
      <rect width="72" height="72" fill="{{t.c}}"></rect>
      <circle cx="46" cy="28" r="24" fill="{{t.a}}"></circle>
      <path d="M-2 50 C 18 34 32 62 74 40 L 74 74 L -2 74 Z" fill="{{t.b}}"></path>
    </svg>
  </div>
  <div style="position: absolute; left: 0; right: 0; top: 456px; display: flex; justify-content: center; gap: 8px; font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums">
    <span>{{now}}</span><span style="color: {{p.sub}}">de {{total}}</span>
  </div>
  <div style="position: absolute; left: 12px; right: 12px; top: 488px; height: 56px; display: flex; align-items: center; gap: 4px">
    <button aria-label="Bajar volumen" onClick="{{volumeDown}}" style="flex: none; width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: {{p.soft}}">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M6 12h12"></path></svg>
    </button>
    <button aria-label="Volumen {{volume}} por ciento" onClick="{{volumeTap}}" style="flex: 1; height: 56px; position: relative; display: block; min-width: 0">
      <span style="position: absolute; left: 0; right: 0; top: 22px; height: 12px; border-radius: 6px; background: {{p.ring}}"></span>
      <span style="position: absolute; left: 0; top: 22px; height: 12px; border-radius: 6px; width: {{volume}}%; background: {{p.ac}}"></span>
      <span style="position: absolute; top: 10px; left: {{volume}}%; margin-left: -26px; width: 52px; height: 36px; display: block">
        <svg width="52" height="36" viewBox="0 0 52 36" aria-hidden="true" style="display: block">
          <path d="M14 11 C 12 2 2 3 3 11 C -1 13 -1 23 3 25 C 2 33 12 34 14 25 L 38 25 C 40 34 50 33 49 25 C 53 23 53 13 49 11 C 50 3 40 2 38 11 Z" fill="#ffffff" stroke="{{p.ink}}" stroke-width="3" stroke-linejoin="round"></path>
        </svg>
      </span>
    </button>
    <button aria-label="Subir volumen" onClick="{{volumeUp}}" style="flex: none; width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: {{p.soft}}">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M6 12h12M12 6v12"></path></svg>
    </button>
  </div>
  <div style="position: absolute; left: 16px; right: 16px; top: 556px; display: flex; align-items: center; justify-content: space-between">
    <button aria-label="Mezclar" aria-pressed="{{shuffle}}" onClick="{{toggleShuffle}}" style="width: 52px; height: 52px; display: flex; align-items: center; justify-content: center; color: {{shuffleColor}}">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7h4l10 10h4"></path><path d="M3 17h4l3-3"></path><path d="M14 10l3-3h4"></path><path d="m18 4 3 3-3 3"></path><path d="m18 14 3 3-3 3"></path></svg>
    </button>
    <button aria-label="Canción anterior" onClick="{{prev}}" style="width: 64px; height: 64px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: {{p.soft}}">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M6 5h2v14H6zM19 5v14L10 12z"></path></svg>
    </button>
    <button aria-label="{{playLabel}}" onClick="{{toggle}}" style="width: 96px; height: 96px; display: block; position: relative; color: {{p.ac}}">
      <svg width="96" height="96" viewBox="0 0 96 96" aria-hidden="true" style="display: block">
        <ellipse cx="18" cy="38" rx="11" ry="14" fill="currentColor"></ellipse>
        <ellipse cx="36" cy="18" rx="11" ry="14" fill="currentColor"></ellipse>
        <ellipse cx="60" cy="18" rx="11" ry="14" fill="currentColor"></ellipse>
        <ellipse cx="78" cy="38" rx="11" ry="14" fill="currentColor"></ellipse>
        <path d="M48 36 C 66 36 80 54 80 68 C 80 84 64 88 48 82 C 32 88 16 84 16 68 C 16 54 30 36 48 36 Z" fill="currentColor"></path>
      </svg>
      <span style="position: absolute; left: 30px; top: 48px; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; color: #ffffff">
        <sc-if value="{{playing}}" hint-placeholder-val="{{ true }}">
          <svg width="30" height="30" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="5" y="4" width="5" height="16" rx="2"></rect><rect x="14" y="4" width="5" height="16" rx="2"></rect></svg>
        </sc-if>
        <sc-if value="{{paused}}" hint-placeholder-val="{{ false }}">
          <svg width="30" height="30" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M8 5v14l11-7z"></path></svg>
        </sc-if>
      </span>
    </button>
    <button aria-label="Canción siguiente" onClick="{{next}}" style="width: 64px; height: 64px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: {{p.soft}}">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M16 5h2v14h-2zM5 5l9 7-9 7z"></path></svg>
    </button>
    <button aria-label="Repetir" aria-pressed="{{repeat}}" onClick="{{toggleRepeat}}" style="width: 52px; height: 52px; display: flex; align-items: center; justify-content: center; color: {{repeatColor}}">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m17 2 4 4-4 4"></path><path d="M3 11V9a3 3 0 0 1 3-3h15"></path><path d="m7 22-4-4 4-4"></path><path d="M21 13v2a3 3 0 0 1-3 3H3"></path></svg>
    </button>
  </div>
  <div style="position: absolute; left: 12px; right: 12px; top: 680px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px">
    <button onClick="{{openQueue}}" style="height: 60px; border-radius: 20px; font-size: 15px; font-weight: 600; background: {{p.soft}}">Cola · 31</button>
    <button onClick="{{cycleSleep}}" style="height: 60px; border-radius: 20px; font-size: 15px; font-weight: 600; background: {{p.soft}}; color: {{sleepColor}}">{{sleep}}</button>
    <button onClick="{{cycleRate}}" style="height: 60px; border-radius: 20px; font-size: 15px; font-weight: 600; background: {{p.soft}}; color: {{rateColor}}">{{rate}}×</button>
    <button aria-label="Ecualizador" onClick="{{toggleEq}}" style="height: 60px; border-radius: 20px; font-size: 15px; font-weight: 600; background: {{p.soft}}; color: {{eqColor}}">Ecualiz.</button>
  </div>
  <sc-if value="{{queueOpen}}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; left: 0; right: 0; bottom: 0; top: 420px; background: {{p.disc}}; border-radius: 32px 32px 0 0; display: flex; flex-direction: column; padding: 12px 0 16px">
      <div style="display: flex; align-items: center; justify-content: space-between; padding: 0 8px 0 24px">
        <h2 style="margin: 0; font-size: 24px; font-weight: 700">A continuación</h2>
        <button aria-label="Cerrar cola" onClick="{{closeQueue}}" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg>
        </button>
      </div>
      <sc-for list="{{list}}" as="item" hint-placeholder-count="4">
        <button onClick="{{item.pick}}" style="display: flex; align-items: center; justify-content: space-between; min-height: 64px; padding: 0 24px; text-align: left">
          <span style="font-size: 18px; font-weight: 600; color: {{item.color}}">{{item.title}}</span>
          <span style="font-size: 15px; color: {{p.sub}}">{{item.artist}}</span>
        </button>
      </sc-for>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;paleta&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Algodón&quot;,&quot;Menta&quot;,&quot;Lavanda&quot;,&quot;Durazno&quot;,&quot;Cielo&quot;,&quot;Limón&quot;],&quot;default&quot;:&quot;Algodón&quot;},&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844}}">
const TRACKS = [
  { title: 'Luz de agosto', artist: 'Marea Alta', dur: 214, a: '#e4572e', b: '#f3c14b', c: '#17324d' },
  { title: 'Sal y cobre', artist: 'Los Faros', dur: 188, a: '#2a9d8f', b: '#e9c46a', c: '#143a3a' },
  { title: 'Última línea', artist: 'Noa Reyes', dur: 241, a: '#c1467e', b: '#f4a3b5', c: '#3a1737' },
  { title: 'Ruta once', artist: 'Marea Alta', dur: 203, a: '#4f7cff', b: '#a7c4ff', c: '#141f4d' },
];
const PALETTES = {
  'Algodón': { bg: '#ffe4ec', disc: '#fff6f8', ring: '#ffc4d6', soft: '#ffd2e0', ink: '#5a2238', sub: '#7f4358', ac: '#e0366f', lazo: '#ff5d8f' },
  'Menta': { bg: '#d6f5e9', disc: '#f3fffa', ring: '#ace8d2', soft: '#bdeedd', ink: '#0f4438', sub: '#2a6252', ac: '#0a7f64', lazo: '#ff8a5c' },
  'Lavanda': { bg: '#e8e0ff', disc: '#f8f5ff', ring: '#cdbfff', soft: '#d9cfff', ink: '#33245f', sub: '#54467f', ac: '#6a49e0', lazo: '#ffb13d' },
  'Durazno': { bg: '#ffe6d1', disc: '#fff7f0', ring: '#ffcba4', soft: '#ffd9bd', ink: '#5c2c14', sub: '#7d4a2e', ac: '#bf4a12', lazo: '#ff7a45' },
  'Cielo': { bg: '#d9efff', disc: '#f4fbff', ring: '#aedcff', soft: '#c2e6ff', ink: '#123a5c', sub: '#2f5a7d', ac: '#1369b3', lazo: '#ff6f91' },
  'Limón': { bg: '#fff6c7', disc: '#fffdee', ring: '#ffe680', soft: '#ffeea3', ink: '#4f4205', sub: '#6a5a12', ac: '#8f6100', lazo: '#ff7aa8' },
};
const SLEEP = ['Dormir', '15 min', '30 min', '60 min'];
const RATES = [1, 1.25, 1.5, 2, 0.75];
const RADIUS = 150;
const LOW_VOLUME = 35;
const HIGH_VOLUME = 70;
const fmt = s => Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0');
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { i: 0, pos: 71, playing: true, volume: 80, pet: 0, shuffle: false, repeat: false, fav: false, queue: false, sleep: 0, rate: 0, eq: true };
  }
  componentDidMount() {
    this.timer = setInterval(() => {
      const s = this.state;
      const pet = Math.max(0, s.pet - 1);
      if (!s.playing) {
        if (pet !== s.pet) this.setState({ pet });
        return;
      }
      const d = TRACKS[s.i].dur;
      const pos = s.pos + RATES[s.rate];
      if (pos >= d) this.go(1); else this.setState({ pos, pet });
    }, 1000);
  }
  componentWillUnmount() { clearInterval(this.timer); }
  go(step) {
    this.setState({ i: (this.state.i + step + TRACKS.length) % TRACKS.length, pos: 0 });
  }
  setVolume(volume) {
    this.setState({ volume: Math.max(0, Math.min(100, Math.round(volume))) });
  }
  mood() {
    const s = this.state;
    if (s.pet > 0) return 'feliz';
    if (!s.playing) return 'triste';
    if (s.volume < LOW_VOLUME) return 'ansioso';
    if (s.volume > HIGH_VOLUME) return 'feliz';
    return 'tranquilo';
  }
  renderVals() {
    const s = this.state;
    const t = TRACKS[s.i];
    const p = PALETTES[this.props.paleta ?? 'Algodón'] ?? PALETTES['Algodón'];
    const f = s.pos / t.dur;
    const angle = f * Math.PI * 2 - Math.PI / 2;
    const length = 2 * Math.PI * RADIUS;
    return {
      t, p,
      mood: this.mood(),
      volume: s.volume,
      dash: (f * length) + ' ' + length,
      thumbX: 170 + Math.cos(angle) * RADIUS,
      thumbY: 170 + Math.sin(angle) * RADIUS,
      now: fmt(s.pos), total: fmt(t.dur),
      playing: s.playing, paused: !s.playing,
      playLabel: s.playing ? 'Pausar' : 'Reproducir',
      shuffle: s.shuffle, shuffleColor: s.shuffle ? p.ac : p.ink,
      repeat: s.repeat, repeatColor: s.repeat ? p.ac : p.ink,
      fav: s.fav, favColor: s.fav ? p.ac : p.ink, favFill: s.fav ? 'currentColor' : 'none',
      sleep: SLEEP[s.sleep], sleepColor: s.sleep ? p.ac : p.ink,
      rate: RATES[s.rate], rateColor: s.rate ? p.ac : p.ink,
      eqColor: s.eq ? p.ac : p.ink,
      queueOpen: s.queue,
      list: TRACKS.map((x, i) => ({ ...x, color: i === s.i ? p.ac : p.ink, pick: () => this.setState({ i, pos: 0, queue: false }) })),
      toggle: () => this.setState({ playing: !s.playing }),
      next: () => this.go(1),
      prev: () => (s.pos > 3 ? this.setState({ pos: 0 }) : this.go(-1)),
      toggleShuffle: () => this.setState({ shuffle: !s.shuffle }),
      toggleRepeat: () => this.setState({ repeat: !s.repeat }),
      toggleFav: () => this.setState({ fav: !s.fav }),
      openQueue: () => this.setState({ queue: true }),
      closeQueue: () => this.setState({ queue: false }),
      cycleSleep: () => this.setState({ sleep: (s.sleep + 1) % SLEEP.length }),
      cycleRate: () => this.setState({ rate: (s.rate + 1) % RATES.length }),
      toggleEq: () => this.setState({ eq: !s.eq }),
      volumeDown: () => this.setVolume(s.volume - 10),
      volumeUp: () => this.setVolume(s.volume + 10),
      volumeTap: e => {
        const r = e.currentTarget.getBoundingClientRect();
        this.setVolume(((e.clientX - r.left) / r.width) * 100);
      },
      ringTap: e => {
        const r = e.currentTarget.getBoundingClientRect();
        const x = e.clientX - (r.left + r.width / 2);
        const y = e.clientY - (r.top + r.height / 2);
        if (Math.hypot(x, y) / (r.width / 2) < 0.72) {
          this.setState({ pet: 2 });
          return;
        }
        const turn = (Math.atan2(y, x) + Math.PI / 2 + Math.PI * 2) % (Math.PI * 2);
        this.setState({ pos: (turn / (Math.PI * 2)) * t.dur });
      },
    };
  }
}
</script>
</body>
</html>
