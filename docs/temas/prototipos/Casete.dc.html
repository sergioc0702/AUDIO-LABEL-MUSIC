<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Tema Mixtape: reproductor</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Reenie+Beanie&amp;family=Barlow+Condensed:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible{outline:2px solid currentColor;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; font-family: 'Barlow Condensed', sans-serif; background: {{p.bg}}; color: {{p.fg}}">
  <svg width="390" height="844" viewBox="0 0 390 844" aria-hidden="true" style="position: absolute; left: 0; top: 0">
    <path transform="translate(92 {{s1}})" d="M0 16 q 10 -22 20 0 t 20 0 t 20 0 t 20 0" fill="none" stroke="{{p.m1}}" stroke-width="7" stroke-linecap="round"></path>
    <path transform="translate(236 {{s2}}) rotate({{r1}} 20 18)" d="M20 0 L 40 36 L 0 36 Z" fill="{{p.m2}}"></path>
    <circle cx="306" cy="{{s3}}" r="15" fill="none" stroke="{{p.m3}}" stroke-width="7"></circle>
    <path transform="translate(204 {{s4}})" d="M0 0 l 14 16 l 14 -16 l 14 16 l 14 -16" fill="none" stroke="{{p.m1}}" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"></path>
    <circle cx="40" cy="{{s5}}" r="9" fill="{{p.m3}}"></circle>
  </svg>
  <div style="position: absolute; left: 0; right: 0; top: 40px; display: flex; justify-content: space-between; padding: 0 8px">
    <button aria-label="Cerrar reproductor" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg>
    </button>
    <button aria-label="Añadir a favoritas" aria-pressed="{{fav}}" onClick="{{toggleFav}}" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; color: {{favColor}}">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="{{favFill}}" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7.5-4.6-9.2-9A5 5 0 0 1 12 7a5 5 0 0 1 9.2 4c-1.7 4.4-9.2 9-9.2 9z"></path></svg>
    </button>
  </div>
  <div style="position: absolute; left: 14px; top: 104px; width: 362px; height: 236px; border-radius: 14px; background: {{p.shell}}; box-shadow: 0 12px 26px rgba(0,0,0,.32); transform: translate({{shakeX}}px, {{shakeY}}px)">
    <div style="position: absolute; left: 16px; right: 16px; top: 14px; height: 150px; border-radius: 6px; background: {{p.label}}; color: {{p.ink}}">
      <div style="position: absolute; left: 0; right: 0; top: 0; height: 12px; border-radius: 6px 6px 0 0; background: {{p.stripe}}"></div>
      <div style="position: absolute; left: 14px; top: 14px; width: {{reveal}}%; max-width: 302px; height: 42px; overflow: hidden">
        <h1 style="margin: 0; width: 302px; font-family: 'Reenie Beanie', cursive; font-weight: 400; font-size: 29px; line-height: 1.35; white-space: nowrap">{{t.title}} · {{t.artist}}</h1>
      </div>
      <div style="position: absolute; left: 60px; right: 60px; top: 62px; height: 76px; border-radius: 38px; background: {{p.window}}; overflow: hidden">
        <svg width="210" height="76" viewBox="0 0 210 76" aria-hidden="true" style="display: block">
          <circle cx="42" cy="38" r="{{leftPack}}" fill="#2a1a12"></circle>
          <circle cx="168" cy="38" r="{{rightPack}}" fill="#2a1a12"></circle>
          <rect x="60" y="66" width="90" height="2" fill="#2a1a12"></rect>
          <g transform="rotate({{leftDeg}} 42 38)">
            <circle cx="42" cy="38" r="17" fill="#f2efe8"></circle>
            <path d="M42 22v8M42 46v8M26 38h8M50 38h8" stroke="#2a1a12" stroke-width="4" stroke-linecap="round"></path>
          </g>
          <g transform="rotate({{rightDeg}} 168 38)">
            <circle cx="168" cy="38" r="17" fill="#f2efe8"></circle>
            <path d="M168 22v8M168 46v8M152 38h8M176 38h8" stroke="#2a1a12" stroke-width="4" stroke-linecap="round"></path>
          </g>
        </svg>
      </div>
      <span style="position: absolute; left: 16px; top: 88px; font-size: 26px; font-weight: 700">A</span>
      <span style="position: absolute; right: 12px; top: 92px; font-size: 16px; font-weight: 600">{{total}}</span>
    </div>
    <div style="position: absolute; left: 62px; right: 62px; bottom: 0; height: 58px; background: {{p.edge}}; clip-path: polygon(10% 0, 90% 0, 100% 100%, 0 100%)"></div>
  </div>
  <div style="position: absolute; left: 24px; right: 24px; top: 358px; display: flex; align-items: center; justify-content: space-between">
    <p style="margin: 0; font-size: 20px; font-weight: 600; color: {{p.sub}}">Pista {{number}} de 31</p>
    <p aria-label="Contador de cinta" style="margin: 0; padding: 3px 10px; font-size: 26px; font-weight: 700; letter-spacing: .14em; font-variant-numeric: tabular-nums; background: {{p.counter}}; color: {{p.counterInk}}">{{count}}</p>
  </div>
  <button aria-label="Cambiar la posición de la canción" onClick="{{seek}}" style="position: absolute; left: 24px; right: 24px; top: 408px; height: 48px; display: block">
    <span style="position: absolute; left: 0; right: 0; top: 18px; height: 12px; background: {{p.line}}"></span>
    <span style="position: absolute; left: 0; top: 18px; height: 12px; width: {{pct}}%; background: {{p.ac}}"></span>
  </button>
  <div style="position: absolute; left: 24px; right: 24px; top: 454px; display: flex; justify-content: space-between; font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; color: {{p.sub}}">
    <span>{{now}}</span><span>quedan {{left}}</span>
  </div>
  <div style="position: absolute; left: 14px; right: 14px; top: 502px; height: 190px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; padding: 6px; box-sizing: border-box; background: {{p.deck}}; border-radius: 10px">
    <button aria-label="Canción anterior" onClick="{{prev}}" style="display: flex; align-items: flex-end; justify-content: center; padding-bottom: 22px; border-radius: 4px; background: {{rewindKey}}; color: {{rewindInk}}; transform: translateY({{rewindDown}}px)">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M11 5v14L2 12zM21 5v14l-9-7z"></path></svg>
    </button>
    <button aria-label="Reproducir" aria-pressed="{{playing}}" onClick="{{play}}" style="display: flex; align-items: flex-end; justify-content: center; padding-bottom: 22px; border-radius: 4px; background: {{playKey}}; color: {{playInk}}; transform: translateY({{playDown}}px)">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4v16l13-8z"></path></svg>
    </button>
    <button aria-label="Pausar" aria-pressed="{{paused}}" onClick="{{pause}}" style="display: flex; align-items: flex-end; justify-content: center; padding-bottom: 22px; border-radius: 4px; background: {{pauseKey}}; color: {{pauseInk}}; transform: translateY({{pauseDown}}px)">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 4h4v16H6zM14 4h4v16h-4z"></path></svg>
    </button>
    <button aria-label="Canción siguiente" onClick="{{next}}" style="display: flex; align-items: flex-end; justify-content: center; padding-bottom: 22px; border-radius: 4px; background: {{forwardKey}}; color: {{forwardInk}}; transform: translateY({{forwardDown}}px)">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 5l9 7-9 7zM13 5l9 7-9 7z"></path></svg>
    </button>
  </div>
  <div style="position: absolute; left: 12px; right: 12px; top: 712px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr))">
    <button onClick="{{openQueue}}" style="height: 72px; font-size: 18px; font-weight: 600">Cola</button>
    <button aria-pressed="{{shuffle}}" onClick="{{toggleShuffle}}" style="height: 72px; font-size: 18px; font-weight: 600; color: {{shuffleColor}}">Mezcla</button>
    <button onClick="{{cycleSleep}}" style="height: 72px; font-size: 18px; font-weight: 600; color: {{sleepColor}}">{{sleep}}</button>
    <button onClick="{{cycleRate}}" style="height: 72px; font-size: 18px; font-weight: 600; color: {{rateColor}}">{{rate}}×</button>
    <button aria-label="Ecualizador" onClick="{{toggleEq}}" style="height: 72px; font-size: 18px; font-weight: 600; color: {{eqColor}}">Ecual.</button>
  </div>
  <sc-if value="{{queueOpen}}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; left: 0; right: 0; bottom: 0; top: 400px; background: {{p.label}}; color: {{p.ink}}; display: flex; flex-direction: column; padding: 8px 0 16px">
      <div style="display: flex; align-items: center; justify-content: space-between; padding: 0 8px 0 24px">
        <h2 style="margin: 0; font-family: 'Reenie Beanie', cursive; font-weight: 400; font-size: 40px">Lado A</h2>
        <button aria-label="Cerrar cola" onClick="{{closeQueue}}" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg>
        </button>
      </div>
      <sc-for list="{{list}}" as="item" hint-placeholder-count="4">
        <button onClick="{{item.pick}}" style="display: flex; align-items: center; justify-content: space-between; min-height: 64px; padding: 0 24px; text-align: left; font-family: 'Reenie Beanie', cursive; font-size: 32px">
          <span style="font-weight: {{item.weight}}">{{item.title}}</span>
          <span>{{item.artist}}</span>
        </button>
      </sc-for>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"paleta":{"editor":"enum","options":["Ahumado","Naranja","Cinta azul","Menta","Chicle","Uva"],"default":"Naranja"},"$preview":{"width":390,"height":844}}'>
const TRACKS = [
  { title: 'Luz de agosto', artist: 'Marea Alta', dur: 214 },
  { title: 'Sal y cobre', artist: 'Los Faros', dur: 188 },
  { title: 'Última línea', artist: 'Noa Reyes', dur: 241 },
  { title: 'Ruta once', artist: 'Marea Alta', dur: 203 },
];
const PALETTES = {
  'Ahumado': { bg: '#1b1a1d', shell: '#3a383e', label: '#ece6d6', ink: '#1d1a15', stripe: '#c63f2b', window: '#c8c2b4', edge: '#2a292d', fg: '#f3f0ea', sub: '#c2bdb2', ac: '#e9542f', line: '#3c3a40', counter: '#0c0c0e', counterInk: '#f3f0ea', deck: '#0c0c0e', key: '#3a383e', keyInk: '#f3f0ea', on: '#e9542f', onInk: '#1b0a05', m1: '#e9542f', m2: '#3fbac2', m3: '#f4c542' },
  'Naranja': { bg: '#ee7a23', shell: '#2a2320', label: '#fbf1dc', ink: '#2a1a10', stripe: '#ee7a23', window: '#d9cbb0', edge: '#1a1512', fg: '#1f1208', sub: '#3f2410', ac: '#1f1208', line: '#c9631a', counter: '#1f1208', counterInk: '#fbf1dc', deck: '#1f1208', key: '#fbf1dc', keyInk: '#1f1208', on: '#2a2320', onInk: '#ffb36b', m1: '#1f1208', m2: '#fbf1dc', m3: '#14a3a8' },
  'Cinta azul': { bg: '#16307a', shell: '#e9e7e1', label: '#ffffff', ink: '#131c3a', stripe: '#16307a', window: '#c4c9d6', edge: '#c7c5be', fg: '#f2f4fb', sub: '#c3cdec', ac: '#ffd23f', line: '#2a4596', counter: '#0c1a48', counterInk: '#ffd23f', deck: '#0c1a48', key: '#e9e7e1', keyInk: '#131c3a', on: '#ffd23f', onInk: '#131c3a', m1: '#ffd23f', m2: '#ff6f91', m3: '#6fe3d0' },
  'Menta': { bg: '#2fb9a6', shell: '#21312f', shellInk: '#f6f1e3', label: '#f6f1e3', ink: '#1d2a28', stripe: '#ff6f59', window: '#cfd8cf', edge: '#162220', fg: '#0d2320', sub: '#123a35', ac: '#0d2320', line: '#1f9485', counter: '#0d2320', counterInk: '#f6f1e3', deck: '#0d2320', key: '#f6f1e3', keyInk: '#0d2320', on: '#ff6f59', onInk: '#2a0a05', m1: '#0d2320', m2: '#ff6f59', m3: '#fff1a8' },
  'Chicle': { bg: '#ff7fb0', shell: '#fff7ec', shellInk: '#3a1030', label: '#ffffff', ink: '#3a1030', stripe: '#ff3d81', window: '#f0dfe4', edge: '#ead9cf', fg: '#3a0f2c', sub: '#541a40', ac: '#3a0f2c', line: '#e55f95', counter: '#3a0f2c', counterInk: '#ffe3ef', deck: '#3a0f2c', key: '#fff7ec', keyInk: '#3a0f2c', on: '#ffe14d', onInk: '#3a0f2c', m1: '#3a0f2c', m2: '#ffe14d', m3: '#2fd0c4' },
  'Uva': { bg: '#3c1a6e', shell: '#241043', shellInk: '#f3ecff', label: '#f3ecff', ink: '#241043', stripe: '#ffb400', window: '#d6cbe8', edge: '#170a2c', fg: '#f3ecff', sub: '#cfc0ea', ac: '#ffb400', line: '#5a3796', counter: '#170a2c', counterInk: '#ffb400', deck: '#170a2c', key: '#f3ecff', keyInk: '#241043', on: '#ffb400', onInk: '#241043', m1: '#ffb400', m2: '#ff5fa2', m3: '#54e0d0' },
};
const SLEEP = ['Dormir', '15 min', '30 min', '60 min'];
const RATES = [1, 1.25, 1.5, 2, 0.75];
const WIND_FRAMES = 30;
const fmt = s => Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0');
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.leftDeg = 0;
    this.rightDeg = 0;
    this.t = 0;
    this.state = { i: 0, pos: 71, playing: true, frame: 0, wind: 0, windDir: 1, pending: null, reveal: 100, shuffle: false, fav: false, queue: false, sleep: 0, rate: 0, eq: true };
  }
  componentDidMount() {
    this.timer = setInterval(() => this.tick(), 33);
  }
  componentWillUnmount() { clearInterval(this.timer); }
  packs(f) {
    return { left: 20 + (1 - f) * 34, right: 20 + f * 34 };
  }
  tick() {
    const s = this.state;
    const dur = TRACKS[s.i].dur;
    const f = s.pos / dur;
    const pack = this.packs(f);
    const moving = s.playing || s.wind > 0;
    const base = s.wind > 0 ? 34 * s.windDir : 3.2;
    if (moving) {
      this.leftDeg = (this.leftDeg + base * (30 / pack.left)) % 360;
      this.rightDeg = (this.rightDeg + base * (30 / pack.right)) % 360;
      this.t += 0.033;
    }
    const next = { frame: s.frame + 1, reveal: Math.min(100, s.reveal + 4) };
    if (s.wind > 0) {
      next.wind = s.wind - 1;
      if (s.wind === Math.floor(WIND_FRAMES / 2) && s.pending !== null) {
        next.i = s.pending;
        next.pos = 0;
        next.pending = null;
        next.reveal = 0;
      }
    } else if (s.playing) {
      const pos = s.pos + 0.033 * RATES[s.rate];
      if (pos >= dur) {
        this.go(1);
        return;
      }
      next.pos = pos;
    }
    this.setState(next);
  }
  change(i, dir) {
    this.setState({ wind: WIND_FRAMES, windDir: dir, pending: i, queue: false });
  }
  go(step) {
    this.change((this.state.i + step + TRACKS.length) % TRACKS.length, step);
  }
  renderVals() {
    const s = this.state;
    const t = TRACKS[s.i];
    const p = PALETTES[this.props.paleta ?? 'Naranja'] ?? PALETTES['Naranja'];
    const f = s.pos / t.dur;
    const pack = this.packs(f);
    const shake = s.wind > 0 ? 1.6 : 0;
    const rewinding = s.wind > 0 && s.windDir < 0;
    const forwarding = s.wind > 0 && s.windDir > 0;
    const key = (down, name) => ({
      [name + 'Key']: down ? p.on : p.key,
      [name + 'Ink']: down ? p.onInk : p.keyInk,
      [name + 'Down']: down ? 5 : 0,
    });
    const float = (start, speed, size) => Math.round((start + Math.sin(this.t * speed) * size) * 10) / 10;
    return {
      t, p,
      pct: f * 100,
      leftPack: pack.left, rightPack: pack.right,
      leftDeg: Math.round(this.leftDeg), rightDeg: Math.round(this.rightDeg),
      shakeX: Math.round(Math.sin(s.frame * 2.1) * shake * 10) / 10,
      shakeY: Math.round(Math.cos(s.frame * 2.7) * shake * 10) / 10,
      reveal: s.reveal,
      s1: float(58, 1.3, 9), s2: float(52, 1.7, 8), s3: float(78, 1.1, 10), s4: float(800, 1.5, 6), s5: float(806, 0.9, 7),
      r1: Math.round(Math.sin(this.t * 1.2) * 24),
      number: s.i + 1,
      count: String(Math.floor(s.wind > 0 ? (s.frame * 37) % 1000 : s.pos)).padStart(3, '0'),
      now: fmt(s.pos), left: fmt(t.dur - s.pos), total: fmt(t.dur),
      playing: s.playing, paused: !s.playing,
      ...key(s.playing && s.wind === 0, 'play'),
      ...key(!s.playing && s.wind === 0, 'pause'),
      ...key(rewinding, 'rewind'),
      ...key(forwarding, 'forward'),
      shuffle: s.shuffle, shuffleColor: s.shuffle ? p.ac : p.sub,
      fav: s.fav, favColor: s.fav ? p.ac : p.fg, favFill: s.fav ? 'currentColor' : 'none',
      sleep: SLEEP[s.sleep], sleepColor: s.sleep ? p.ac : p.sub,
      rate: RATES[s.rate], rateColor: s.rate ? p.ac : p.sub,
      eqColor: s.eq ? p.ac : p.sub,
      queueOpen: s.queue,
      list: TRACKS.map((x, i) => ({ ...x, weight: i === s.i ? 700 : 400, pick: () => this.change(i, i > s.i ? 1 : -1) })),
      play: () => this.setState({ playing: true }),
      pause: () => this.setState({ playing: false }),
      next: () => this.go(1),
      prev: () => (s.pos > 3 ? this.setState({ pos: 0, wind: 14, windDir: -1 }) : this.go(-1)),
      toggleShuffle: () => this.setState({ shuffle: !s.shuffle }),
      toggleFav: () => this.setState({ fav: !s.fav }),
      openQueue: () => this.setState({ queue: true }),
      closeQueue: () => this.setState({ queue: false }),
      cycleSleep: () => this.setState({ sleep: (s.sleep + 1) % SLEEP.length }),
      cycleRate: () => this.setState({ rate: (s.rate + 1) % RATES.length }),
      toggleEq: () => this.setState({ eq: !s.eq }),
      seek: e => {
        const r = e.currentTarget.getBoundingClientRect();
        this.setState({ pos: Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)) * t.dur });
      },
    };
  }
}
</script>
</body>
</html>
