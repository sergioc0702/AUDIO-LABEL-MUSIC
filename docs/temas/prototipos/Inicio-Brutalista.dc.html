<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Tema Brutalista: Inicio</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&amp;family=Archivo:wght@700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;border-radius:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; font-family: Archivo, sans-serif; font-weight: 800; background: {{p.bg}}; color: {{p.ink}}">
  <div style="position: absolute; left: 0; right: 0; top: 0; height: 262px; box-sizing: border-box; padding: 34px 12px 0; border-bottom: 5px solid {{p.ink}}">
    <h1 style="margin: 0; font-family: Anton, sans-serif; font-weight: 400; font-size: 104px; line-height: 104px; text-transform: uppercase">Buenos<br>días</h1>
  </div>
  <button aria-label="Ajustes" style="position: absolute; right: 0; top: 0; width: 76px; height: 92px; display: flex; align-items: center; justify-content: center; background: {{p.hot}}; color: {{p.onHot}}">
    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.6" stroke-linecap="square" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10M16 5v4M8 15v4"></path></svg>
  </button>
  <div style="position: absolute; left: 0; right: 0; top: 262px; display: flex; flex-direction: column">
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="6">
      <button style="height: 58px; display: flex; align-items: center; justify-content: space-between; padding: 0 12px; text-align: left; font-family: Anton, sans-serif; font-weight: 400; font-size: 32px; text-transform: uppercase; border-bottom: 3px solid {{p.ink}}; background: {{r.bg}}; color: {{r.fg}}">
        <span>{{r.label}}</span>
        <span style="font-family: Archivo, sans-serif; font-weight: 800; font-size: 18px">{{r.count}}</span>
      </button>
    </sc-for>
  </div>
  <div style="position: absolute; left: 0; right: 0; top: 628px; height: 100px; display: grid; grid-template-columns: 100px minmax(0, 1fr) 100px; background: {{p.ink}}; color: {{p.bg}}">
    <svg width="100" height="100" viewBox="0 0 100 100" aria-hidden="true" style="display: block">
      <rect width="100" height="100" fill="{{p.hot}}"></rect>
      <circle cx="66" cy="46" r="54" fill="{{p.ink}}"></circle>
      <rect y="68" width="100" height="12" fill="{{p.paper}}"></rect>
    </svg>
    <div style="display: flex; flex-direction: column; justify-content: center; padding: 0 12px; min-width: 0">
      <p style="margin: 0; font-family: Anton, sans-serif; font-weight: 400; font-size: 28px; line-height: 1.1; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Luz de agosto</p>
      <p style="margin: 0; font-size: 15px">MAREA ALTA</p>
    </div>
    <button aria-label="Pausar" style="display: flex; align-items: center; justify-content: center; background: {{p.hot}}; color: {{p.onHot}}; font-family: Anton, sans-serif; font-weight: 400; font-size: 26px">PAUSA</button>
  </div>
  <div style="position: absolute; left: 0; right: 0; top: 728px; height: 116px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr))">
    <sc-for list="{{tabs}}" as="tab" hint-placeholder-count="3">
      <button style="font-size: 16px; border-right: 3px solid {{p.ink}}; background: {{tab.bg}}; color: {{tab.fg}}">{{tab.label}}</button>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"paleta":{"editor":"enum","options":["Concreto","Papel","Ácido","Noche","Ladrillo","Plano"],"default":"Ácido"},"$preview":{"width":390,"height":844}}'>
const PALETTES = {
  'Concreto': { bg: '#bdbab2', ink: '#000000', hot: '#ff3b00', onHot: '#000000', paper: '#ece9e2' },
  'Papel': { bg: '#ffffff', ink: '#000000', hot: '#0000ff', onHot: '#ffffff', paper: '#ffffff' },
  'Ácido': { bg: '#e6ff1a', ink: '#000000', hot: '#ff00a8', onHot: '#000000', paper: '#ffffff' },
  'Noche': { bg: '#111111', ink: '#f2f2f2', hot: '#ff3b00', onHot: '#000000', paper: '#3a3a3a' },
  'Ladrillo': { bg: '#d4502f', ink: '#000000', hot: '#ffe9c7', onHot: '#000000', paper: '#f4d9b8' },
  'Plano': { bg: '#1f45e8', ink: '#ffffff', hot: '#ffe600', onHot: '#000000', paper: '#0b1f7a' },
};
const ROWS = [
  { label: 'Favoritas', count: '12' },
  { label: 'Mezclar todo', count: '37' },
  { label: 'Más escuchadas', count: '20' },
  { label: 'Recientes', count: '8' },
  { label: 'Añadidas', count: '37' },
  { label: 'Tus listas', count: '3' },
];
class Component extends DCLogic {
  renderVals() {
    const p = PALETTES[this.props.paleta ?? 'Concreto'] ?? PALETTES['Concreto'];
    return {
      p,
      rows: ROWS.map((row, index) => ({ ...row, bg: index === 1 ? p.hot : 'transparent', fg: index === 1 ? p.onHot : p.ink })),
      tabs: ['INICIO', 'BUSCAR', 'BIBLIOTECA'].map((label, index) => ({ label, bg: index === 0 ? p.ink : p.bg, fg: index === 0 ? p.bg : p.ink })),
    };
  }
}
</script>
</body>
</html>
