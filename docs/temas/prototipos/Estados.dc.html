<head>

<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width: 1240px; height: 420px; box-sizing: border-box; padding: 24px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; font-family: Fredoka, sans-serif; background: #ffe4ec; color: #5a2238">
  <div style="display: flex; flex-direction: column; align-items: center; gap: 6px; background: #fff6f8; border-radius: 28px; padding: 16px 12px">
    <dc-import name="Perrito" mood="triste" size="270" hint-size="270px,270px"></dc-import>
    <h2 style="margin: 0; font-size: 24px; font-weight: 700">Triste</h2>
    <p style="margin: 0; font-size: 16px; color: #7f4358">Música en pausa</p>
  </div>
  <div style="display: flex; flex-direction: column; align-items: center; gap: 6px; background: #fff6f8; border-radius: 28px; padding: 16px 12px">
    <dc-import name="Perrito" mood="ansioso" size="270" hint-size="270px,270px"></dc-import>
    <h2 style="margin: 0; font-size: 24px; font-weight: 700">Ansioso</h2>
    <p style="margin: 0; font-size: 16px; color: #7f4358">Suena con volumen bajo, menos de 35 %</p>
  </div>
  <div style="display: flex; flex-direction: column; align-items: center; gap: 6px; background: #fff6f8; border-radius: 28px; padding: 16px 12px">
    <dc-import name="Perrito" mood="tranquilo" size="270" hint-size="270px,270px"></dc-import>
    <h2 style="margin: 0; font-size: 24px; font-weight: 700">Tranquilo</h2>
    <p style="margin: 0; font-size: 16px; color: #7f4358">Volumen medio, de 35 a 70 %</p>
  </div>
  <div style="display: flex; flex-direction: column; align-items: center; gap: 6px; background: #fff6f8; border-radius: 28px; padding: 16px 12px">
    <dc-import name="Perrito" mood="feliz" size="270" hint-size="270px,270px"></dc-import>
    <h2 style="margin: 0; font-size: 24px; font-weight: 700">Muy feliz</h2>
    <p style="margin: 0; font-size: 16px; color: #7f4358">Volumen alto, más de 70 %</p>
  </div>
</div>
</x-dc>
