<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Tema Tornamesa: Inicio</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; font-family: 'Bricolage Grotesque', sans-serif; background: {{p.bg}}; color: {{p.fg}}">
  <div style="position: absolute; left: 20px; right: 8px; top: 44px; display: flex; align-items: center; justify-content: space-between">
    <h1 style="margin: 0; font-size: 34px; font-weight: 700">Buenos días</h1>
    <button aria-label="Ajustes" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10M16 5v4M8 15v4"></path></svg>
    </button>
  </div>
  <h2 style="position: absolute; left: 20px; top: 104px; margin: 0; font-size: 20px; font-weight: 700">En la repisa</h2>
  <div style="position: absolute; left: 0; right: 0; top: 136px; height: 214px; overflow: hidden">
    <div style="position: absolute; left: 20px; top: 0; display: flex; gap: 14px">
      <sc-for list="{{sleeves}}" as="r" hint-placeholder-count="3">
        <div style="position: relative; width: 178px; height: 178px; flex: none">
          <svg width="150" height="150" viewBox="0 0 150 150" aria-hidden="true" style="position: absolute; left: 34px; top: 14px">
            <circle cx="75" cy="75" r="74" fill="#101012"></circle>
            <circle cx="75" cy="75" r="26" fill="{{r.a}}"></circle>
            <circle cx="75" cy="75" r="4" fill="{{p.bg}}"></circle>
          </svg>
          <svg width="178" height="178" viewBox="0 0 178 178" aria-hidden="true" style="position: absolute; left: 0; top: 0; box-shadow: 0 8px 16px rgba(0,0,0,.35)">
            <rect width="178" height="178" fill="{{r.c}}"></rect>
            <circle cx="118" cy="68" r="62" fill="{{r.a}}"></circle>
            <path d="M-6 130 C 46 88 88 158 184 100 L 184 184 L -6 184 Z" fill="{{r.b}}"></path>
          </svg>
        </div>
      </sc-for>
    </div>
    <div style="position: absolute; left: 0; right: 0; top: 178px; height: 14px; background: {{p.shelf}}"></div>
    <div style="position: absolute; left: 0; right: 0; top: 192px; height: 8px; background: {{p.shelfEdge}}"></div>
  </div>
  <div style="position: absolute; left: 20px; right: 20px; top: 356px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
    <sc-for list="{{shortcuts}}" as="s" hint-placeholder-count="6">
      <button style="height: 72px; border-radius: 8px; display: flex; align-items: flex-end; padding: 0 12px 10px; text-align: left; font-size: 17px; font-weight: 700; background: {{p.key}}; box-shadow: 0 3px 0 {{p.keyEdge}}">{{s}}</button>
    </sc-for>
  </div>
  <div style="position: absolute; left: 12px; right: 12px; top: 640px; height: 80px; border-radius: 10px; display: flex; align-items: center; gap: 12px; padding: 0 14px 0 10px; box-sizing: border-box; background: {{p.mat}}">
    <svg width="60" height="60" viewBox="0 0 60 60" aria-hidden="true" style="flex: none">
      <circle cx="30" cy="30" r="30" fill="#101012"></circle>
      <circle cx="30" cy="30" r="20" fill="none" stroke="#2b2b30"></circle>
      <circle cx="30" cy="30" r="12" fill="#e4572e"></circle>
      <path d="M30 18 A12 12 0 0 1 42 30 L30 30 Z" fill="#f3c14b"></path>
      <circle cx="30" cy="30" r="2.5" fill="{{p.mat}}"></circle>
    </svg>
    <div style="flex: 1; min-width: 0">
      <p style="margin: 0; font-size: 18px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Luz de agosto</p>
      <p style="margin: 0; font-size: 15px; color: {{p.sub}}">Marea Alta</p>
    </div>
    <button aria-label="Pausar" style="width: 56px; height: 56px; border-radius: 8px; display: flex; align-items: center; justify-content: center; background: {{p.ac}}; color: {{p.on}}">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 4h4v16H6zM14 4h4v16h-4z"></path></svg>
    </button>
  </div>
  <div style="position: absolute; left: 12px; right: 12px; top: 734px; height: 72px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr))">
    <sc-for list="{{tabs}}" as="tab" hint-placeholder-count="3">
      <button style="font-size: 15px; font-weight: 700; color: {{tab.fg}}">{{tab.label}}</button>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"paleta":{"editor":"enum","options":["Nogal","Aluminio","Mesa verde","Cerezo","Crema","Medianoche"],"default":"Nogal"},"$preview":{"width":390,"height":844}}'>
const PALETTES = {
  'Nogal': { bg: '#3a2417', mat: '#26170e', key: '#54382a', keyEdge: '#21130b', shelf: '#6b4630', shelfEdge: '#21130b', fg: '#f7ecdd', sub: '#d9c6ad', ac: '#f2a33c', on: '#2a1606' },
  'Aluminio': { bg: '#d5d7d9', mat: '#c0c2c5', key: '#e9eaec', keyEdge: '#9b9ea2', shelf: '#8d9094', shelfEdge: '#6f7276', fg: '#17181a', sub: '#44474b', ac: '#c62f19', on: '#ffffff' },
  'Mesa verde': { bg: '#12362c', mat: '#0b241d', key: '#1d4d40', keyEdge: '#091c16', shelf: '#2a5d4f', shelfEdge: '#091c16', fg: '#f0efe2', sub: '#bcd0c0', ac: '#e8c35a', on: '#1c1604' },
  'Cerezo': { bg: '#4a1a1f', sheet: '#5a242a', mat: '#2c0d11', key: '#662b31', keyEdge: '#250a0e', shelf: '#7a3a3f', shelfEdge: '#250a0e', arm: '#e8d6c4', fg: '#fbeee3', sub: '#e0c5b8', ac: '#f0b35c', on: '#2c1404', line: '#6e3a40', meter: '#f5e6c8', meterInk: '#2c1404' },
  'Crema': { bg: '#efe3cf', sheet: '#e3d4ba', mat: '#cdb999', key: '#f8efe0', keyEdge: '#b9a483', shelf: '#a58c68', shelfEdge: '#7c6547', arm: '#3a2a1c', fg: '#2a1d12', sub: '#5a4632', ac: '#a8481c', on: '#ffffff', line: '#c7b494', meter: '#fffaf0', meterInk: '#2a1d12' },
  'Medianoche': { bg: '#141a2e', sheet: '#1d2540', mat: '#0b0f1e', key: '#252e4e', keyEdge: '#070a15', shelf: '#39436a', shelfEdge: '#070a15', arm: '#cfd6e6', fg: '#eef1f8', sub: '#b4bdd3', ac: '#6fc3ff', on: '#06202f', line: '#323c60', meter: '#e9edf5', meterInk: '#0b0f1e' },
};
const SLEEVES = [
  { a: '#e4572e', b: '#f3c14b', c: '#17324d' },
  { a: '#2a9d8f', b: '#e9c46a', c: '#143a3a' },
  { a: '#c1467e', b: '#f4a3b5', c: '#3a1737' },
];
class Component extends DCLogic {
  renderVals() {
    const p = PALETTES[this.props.paleta ?? 'Nogal'] ?? PALETTES['Nogal'];
    return {
      p,
      sleeves: SLEEVES,
      shortcuts: ['Favoritas', 'Mezclar todo', 'Más escuchadas', 'Recientes', 'Añadidas', 'Tus listas'],
      tabs: ['Inicio', 'Buscar', 'Biblioteca'].map((label, index) => ({ label, fg: index === 0 ? p.ac : p.fg })),
    };
  }
}
</script>
</body>
</html>
