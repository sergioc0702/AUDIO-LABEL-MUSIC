<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Tema Kawaii: Inicio</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; font-family: Fredoka, sans-serif; background: {{p.bg}}; color: {{p.ink}}">
  <div style="position: absolute; left: 20px; right: 8px; top: 44px; display: flex; align-items: center; justify-content: space-between">
    <h1 style="margin: 0; font-size: 32px; font-weight: 700">¡Buenos días!</h1>
    <button aria-label="Ajustes" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10M16 5v4M8 15v4"></path></svg>
    </button>
  </div>
  <div style="position: absolute; left: 16px; right: 16px; top: 108px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
    <sc-for list="{{shortcuts}}" as="s" hint-placeholder-count="6">
      <button style="height: 64px; border-radius: 22px; display: flex; align-items: center; gap: 10px; padding: 0 12px; text-align: left; font-size: 16px; font-weight: 600; background: {{p.disc}}">
        <span style="width: 40px; height: 40px; flex: none; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: {{p.soft}}; color: {{p.ac}}">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{s.d}}"></path></svg>
        </span>
        <span>{{s.label}}</span>
      </button>
    </sc-for>
  </div>
  <h2 style="position: absolute; left: 20px; top: 338px; margin: 0; font-size: 22px; font-weight: 700">Escuchado hace poco</h2>
  <div style="position: absolute; left: 16px; top: 376px; width: 460px; display: flex; gap: 12px">
    <sc-for list="{{recent}}" as="r" hint-placeholder-count="3">
      <div style="width: 138px; flex: none">
        <div style="width: 138px; height: 138px; border-radius: 50%; overflow: hidden; border: 5px solid {{p.disc}}; box-sizing: border-box">
          <svg width="128" height="128" viewBox="0 0 128 128" aria-hidden="true" style="display: block">
            <rect width="128" height="128" fill="{{r.c}}"></rect>
            <circle cx="84" cy="50" r="44" fill="{{r.a}}"></circle>
            <path d="M-4 92 C 30 62 62 112 132 72 L 132 132 L -4 132 Z" fill="{{r.b}}"></path>
          </svg>
        </div>
        <p style="margin: 8px 0 0; text-align: center; font-size: 16px; font-weight: 600">{{r.title}}</p>
        <p style="margin: 0; text-align: center; font-size: 14px; color: {{p.sub}}">{{r.artist}}</p>
      </div>
    </sc-for>
  </div>
  <div style="position: absolute; left: 12px; right: 12px; top: 618px; height: 84px; border-radius: 42px; display: flex; align-items: center; gap: 8px; padding: 0 16px 0 8px; box-sizing: border-box; background: {{p.disc}}">
    <dc-import name="Perrito" mood="tranquilo" size="76" lazo="{{p.lazo}}" quiet="{{yes}}" hint-size="76px,76px"></dc-import>
    <div style="flex: 1; min-width: 0">
      <p style="margin: 0; font-size: 17px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Luz de agosto</p>
      <p style="margin: 0; font-size: 14px; color: {{p.sub}}">Marea Alta</p>
    </div>
    <button aria-label="Pausar" style="width: 52px; height: 52px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: {{p.ac}}; color: #ffffff">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="5" y="4" width="5" height="16" rx="2"></rect><rect x="14" y="4" width="5" height="16" rx="2"></rect></svg>
    </button>
  </div>
  <div style="position: absolute; left: 12px; right: 12px; top: 716px; height: 88px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px">
    <sc-for list="{{tabs}}" as="tab" hint-placeholder-count="3">
      <button style="border-radius: 26px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 14px; font-weight: 600; background: {{tab.bg}}; color: {{tab.fg}}">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{tab.d}}"></path></svg>
        <span>{{tab.label}}</span>
      </button>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"paleta":{"editor":"enum","options":["Algodón","Menta","Lavanda","Durazno","Cielo","Limón"],"default":"Lavanda"},"$preview":{"width":390,"height":844}}'>
const PALETTES = {
  'Algodón': { bg: '#ffe4ec', disc: '#fff6f8', soft: '#ffd2e0', ink: '#5a2238', sub: '#7f4358', ac: '#e0366f', lazo: '#ff5d8f' },
  'Menta': { bg: '#d6f5e9', disc: '#f3fffa', soft: '#bdeedd', ink: '#0f4438', sub: '#2a6252', ac: '#0a7f64', lazo: '#ff8a5c' },
  'Lavanda': { bg: '#e8e0ff', disc: '#f8f5ff', soft: '#d9cfff', ink: '#33245f', sub: '#54467f', ac: '#6a49e0', lazo: '#ffb13d' },
  'Durazno': { bg: '#ffe6d1', disc: '#fff7f0', ring: '#ffcba4', soft: '#ffd9bd', ink: '#5c2c14', sub: '#7d4a2e', ac: '#bf4a12', lazo: '#ff7a45' },
  'Cielo': { bg: '#d9efff', disc: '#f4fbff', ring: '#aedcff', soft: '#c2e6ff', ink: '#123a5c', sub: '#2f5a7d', ac: '#1369b3', lazo: '#ff6f91' },
  'Limón': { bg: '#fff6c7', disc: '#fffdee', ring: '#ffe680', soft: '#ffeea3', ink: '#4f4205', sub: '#6a5a12', ac: '#8f6100', lazo: '#ff7aa8' },
};
const SHORTCUTS = [
  { label: 'Favoritas', d: 'M12 20s-7.5-4.6-9.2-9A5 5 0 0 1 12 7a5 5 0 0 1 9.2 4c-1.7 4.4-9.2 9-9.2 9z' },
  { label: 'Mezclar todo', d: 'M3 7h4l10 10h4M3 17h4l3-3M14 10l3-3h4M18 4l3 3-3 3M18 14l3 3-3 3' },
  { label: 'Más oídas', d: 'M3 17l6-6 4 4 8-8M15 7h6v6' },
  { label: 'Recientes', d: 'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM12 7v5l3 2' },
  { label: 'Añadidas', d: 'M12 5v14M5 12h14' },
  { label: 'Tus listas', d: 'M4 6h16M4 12h10M4 18h7' },
];
const RECENT = [
  { title: 'Luz de agosto', artist: 'Marea Alta', a: '#e4572e', b: '#f3c14b', c: '#17324d' },
  { title: 'Sal y cobre', artist: 'Los Faros', a: '#2a9d8f', b: '#e9c46a', c: '#143a3a' },
  { title: 'Última línea', artist: 'Noa Reyes', a: '#c1467e', b: '#f4a3b5', c: '#3a1737' },
];
const TABS = [
  { label: 'Inicio', d: 'M4 11l8-7 8 7v9h-5v-6H9v6H4z' },
  { label: 'Buscar', d: 'M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14zM20 20l-4-4' },
  { label: 'Biblioteca', d: 'M5 4v16M10 4v16M15 5l4 15' },
];
class Component extends DCLogic {
  renderVals() {
    const p = PALETTES[this.props.paleta ?? 'Algodón'] ?? PALETTES['Algodón'];
    return {
      p, yes: true,
      shortcuts: SHORTCUTS,
      recent: RECENT,
      tabs: TABS.map((tab, index) => ({ ...tab, bg: index === 0 ? p.ac : 'transparent', fg: index === 0 ? '#ffffff' : p.ink })),
    };
  }
}
</script>
</body>
</html>
