<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Tema Terminal: Inicio</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;border-radius:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; font-family: 'JetBrains Mono', Consolas, monospace; font-size: 14px; line-height: 20px; background: {{p.bg}}; color: {{p.fg}}">
  <div style="position: absolute; left: 10px; right: 10px; top: 42px">
    <div style="white-space: pre">{{prompt}}<span style="color: {{p.cmd}}">Get-Biblioteca</span></div>
    <div style="height: 20px"></div>
    <div style="white-space: pre; color: {{p.dim}}">    Directorio: C:\Música</div>
    <div style="height: 20px"></div>
    <div style="white-space: pre">Modo   Pistas  Nombre</div>
    <div style="white-space: pre">----   ------  ------</div>
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="6">
      <button style="display: block; width: 370px; min-height: 44px; text-align: left; white-space: pre">{{r.line}}</button>
    </sc-for>
    <div style="height: 20px"></div>
    <div style="white-space: pre">{{prompt}}<span style="color: {{p.cmd}}">Get-Reciente -Top 2</span></div>
    <sc-for list="{{recent}}" as="r" hint-placeholder-count="2">
      <button style="display: block; width: 370px; min-height: 44px; text-align: left; white-space: pre">{{r.line}}</button>
    </sc-for>
    <div style="white-space: pre">{{prompt}}<span>█</span></div>
  </div>
  <div style="position: absolute; left: 0; right: 0; top: 722px; height: 58px; display: flex; align-items: center; justify-content: space-between; box-sizing: border-box; padding: 0 10px; background: {{p.band}}; color: {{p.bandInk}}; font-weight: 700">
    <span style="white-space: pre">Luz de agosto  1:11/3:34</span>
    <button aria-label="Pausar" style="height: 48px; font-weight: 700">[ Suspender ]</button>
  </div>
  <div style="position: absolute; left: 0; right: 0; top: 780px; height: 64px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr))">
    <sc-for list="{{tabs}}" as="tab" hint-placeholder-count="3">
      <button style="font-weight: 700; color: {{tab.fg}}">{{tab.label}}</button>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"paleta":{"editor":"enum","options":["Azul clásico","Negro","Ámbar","Fósforo","Papel","Púrpura"],"default":"Azul clásico"},"$preview":{"width":390,"height":844}}'>
const PALETTES = {
  'Azul clásico': { bg: '#012456', fg: '#eeedf0', cmd: '#ffff00', dim: '#8fa8cc', band: '#00b4c8', bandInk: '#00212b' },
  'Negro': { bg: '#0c0c0c', fg: '#cccccc', cmd: '#f9f1a5', dim: '#8a8a8a', band: '#3a96dd', bandInk: '#000000' },
  'Ámbar': { bg: '#140c02', fg: '#ffb000', cmd: '#ffe08a', dim: '#b27a14', band: '#ffb000', bandInk: '#140c02' },
  'Fósforo': { bg: '#04140a', fg: '#33ff66', cmd: '#c8ffd4', dim: '#22a650', band: '#33ff66', bandInk: '#04140a' },
  'Papel': { bg: '#f7f5ee', fg: '#1f2430', cmd: '#a13a00', dim: '#62666f', band: '#1f2430', bandInk: '#f7f5ee' },
  'Púrpura': { bg: '#1e1033', fg: '#e8def8', cmd: '#ff9ee8', dim: '#a896cc', band: '#b794f6', bandInk: '#1e1033' },
};
const ROWS = [
  ['d----', 12, 'Favoritas'],
  ['-a---', 37, 'Mezclar-Todo'],
  ['d----', 20, 'Mas-Escuchadas'],
  ['d----', 8, 'Recientes'],
  ['d----', 37, 'Añadidas'],
  ['d----', 3, 'Listas'],
];
class Component extends DCLogic {
  renderVals() {
    const p = PALETTES[this.props.paleta ?? 'Azul clásico'] ?? PALETTES['Azul clásico'];
    return {
      p,
      prompt: 'PS C:\\Música> ',
      rows: ROWS.map(([mode, count, name]) => ({ line: mode + '  ' + String(count).padStart(6) + '  ' + name })),
      recent: [{ line: '1  Luz de agosto   Marea Alta' }, { line: '2  Sal y cobre     Los Faros' }],
      tabs: ['Inicio', 'Buscar', 'Biblioteca'].map((label, index) => ({
        label: index === 0 ? '[' + label + ']' : label,
        fg: index === 0 ? p.cmd : p.fg,
      })),
    };
  }
}
</script>
</body>
</html>
