<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Tema Taquilla: reproductor</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&amp;family=Courier+Prime:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible{outline:2px solid currentColor;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; font-family: 'Courier Prime', monospace; background: {{p.bg}}; color: {{p.fg}}">
  <div style="position: absolute; left: 0; right: 0; top: 36px; display: flex; justify-content: space-between; padding: 0 8px">
    <button aria-label="Cerrar reproductor" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg>
    </button>
    <button aria-label="Añadir a favoritas" aria-pressed="{{fav}}" onClick="{{toggleFav}}" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; color: {{favColor}}">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="{{favFill}}" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7.5-4.6-9.2-9A5 5 0 0 1 12 7a5 5 0 0 1 9.2 4c-1.7 4.4-9.2 9-9.2 9z"></path></svg>
    </button>
  </div>
  <div style="position: absolute; left: 20px; top: 480px; width: 350px; height: 174px; background: {{p.paper}}; color: {{p.ink}}; border-radius: 0 0 10px 10px; transform-origin: 40px 0; transform: translate({{stubX}}px, {{stubY}}px) rotate({{stubRot}}deg)">
    <button aria-label="Cambiar la posición de la canción" onClick="{{seek}}" style="position: absolute; left: 20px; right: 20px; top: 20px; height: 96px; display: flex; align-items: stretch; justify-content: space-between">
      <sc-for list="{{bars}}" as="bar" hint-placeholder-count="44">
        <span style="display: block; flex: none; width: {{bar.w}}px; background: {{bar.color}}"></span>
      </sc-for>
    </button>
    <div style="position: absolute; left: 20px; right: 20px; top: 126px; display: flex; justify-content: space-between; font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums">
      <span>{{now}}</span><span>faltan {{left}}</span>
    </div>
  </div>
  <div style="position: absolute; left: 20px; top: 88px; width: 350px; height: 392px; background: {{p.paper}}; color: {{p.ink}}; border-radius: 10px 10px 0 0; transform: translateX({{ticketX}}px)">
    <div style="position: absolute; left: 0; top: 0; width: 350px; height: 196px; border-radius: 10px 10px 0 0; overflow: hidden">
      <svg width="350" height="196" viewBox="0 0 350 196" aria-hidden="true" style="display: block">
        <rect width="350" height="196" fill="{{t.c}}"></rect>
        <circle cx="244" cy="86" r="96" fill="{{t.a}}"></circle>
        <path d="M-10 150 C 90 90 170 200 360 110 L 360 210 L -10 210 Z" fill="{{t.b}}"></path>
      </svg>
    </div>
    <h1 style="position: absolute; left: 20px; right: 20px; top: 212px; margin: 0; font-family: 'Alfa Slab One', serif; font-weight: 400; font-size: 32px; line-height: 1.08; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{t.title}}</h1>
    <div style="position: absolute; left: 20px; right: 20px; top: 264px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); row-gap: 10px; column-gap: 12px; font-size: 13px; line-height: 1.2">
      <div>Artista<br><strong style="font-size: 18px">{{t.artist}}</strong></div>
      <div>Álbum<br><strong style="font-size: 18px">{{t.album}}</strong></div>
      <div>Pista<br><strong style="font-size: 18px">{{number}} de 31</strong></div>
      <div>Duración<br><strong style="font-size: 18px">{{total}}</strong></div>
    </div>
    <div style="position: absolute; left: 18px; right: 18px; top: 389px; border-top: 3px dashed {{p.perf}}"></div>
    <div style="position: absolute; left: -14px; top: 376px; width: 28px; height: 28px; border-radius: 50%; background: {{p.bg}}"></div>
    <div style="position: absolute; right: -14px; top: 376px; width: 28px; height: 28px; border-radius: 50%; background: {{p.bg}}"></div>
    <div aria-hidden="true" style="position: absolute; left: 170px; top: 128px; padding: 6px 12px; border: 4px solid {{p.stamp}}; border-radius: 8px; color: {{p.stamp}}; font-family: 'Alfa Slab One', serif; font-size: 25px; line-height: 1.1; background: {{p.paper}}; opacity: {{stampOpacity}}; transform: rotate(-11deg) scale({{stampScale}})">ADMITIDO</div>
  </div>
  <div style="position: absolute; left: 20px; right: 20px; top: 668px; display: flex; align-items: center; justify-content: space-between">
    <button aria-label="Mezclar" aria-pressed="{{shuffle}}" onClick="{{toggleShuffle}}" style="width: 52px; height: 72px; display: flex; align-items: center; justify-content: center; color: {{shuffleColor}}">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7h4l10 10h4"></path><path d="M3 17h4l3-3"></path><path d="M14 10l3-3h4"></path><path d="m18 4 3 3-3 3"></path><path d="m18 14 3 3-3 3"></path></svg>
    </button>
    <button aria-label="Canción anterior" onClick="{{prev}}" style="width: 60px; height: 72px; display: flex; align-items: center; justify-content: center">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 5h2.5v14H6zM19 5v14L9 12z"></path></svg>
    </button>
    <button aria-label="{{playLabel}}" onClick="{{toggle}}" style="width: 112px; height: 72px; border-radius: 10px; display: flex; align-items: center; justify-content: center; background: {{p.paper}}; color: {{p.ink}}">
      <sc-if value="{{playing}}" hint-placeholder-val="{{ true }}">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 4h4v16H6zM14 4h4v16h-4z"></path></svg>
      </sc-if>
      <sc-if value="{{paused}}" hint-placeholder-val="{{ false }}">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4v16l13-8z"></path></svg>
      </sc-if>
    </button>
    <button aria-label="Canción siguiente" onClick="{{next}}" style="width: 60px; height: 72px; display: flex; align-items: center; justify-content: center">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M15.5 5H18v14h-2.5zM5 5l10 7-10 7z"></path></svg>
    </button>
    <button aria-label="Repetir" aria-pressed="{{repeat}}" onClick="{{toggleRepeat}}" style="width: 52px; height: 72px; display: flex; align-items: center; justify-content: center; color: {{repeatColor}}">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m17 2 4 4-4 4"></path><path d="M3 11V9a3 3 0 0 1 3-3h15"></path><path d="m7 22-4-4 4-4"></path><path d="M21 13v2a3 3 0 0 1-3 3H3"></path></svg>
    </button>
  </div>
  <div style="position: absolute; left: 12px; right: 12px; top: 752px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr))">
    <button onClick="{{openQueue}}" style="height: 64px; font-size: 15px; font-weight: 700">Cola · 31</button>
    <button onClick="{{cycleSleep}}" style="height: 64px; font-size: 15px; font-weight: 700; color: {{sleepColor}}">{{sleep}}</button>
    <button onClick="{{cycleRate}}" style="height: 64px; font-size: 15px; font-weight: 700; color: {{rateColor}}">{{rate}}×</button>
    <button aria-label="Ecualizador" onClick="{{toggleEq}}" style="height: 64px; font-size: 15px; font-weight: 700; color: {{eqColor}}">Ecualiz.</button>
  </div>
  <sc-if value="{{queueOpen}}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; left: 20px; right: 20px; bottom: 0; top: 390px; background: {{p.paper}}; color: {{p.ink}}; border-radius: 10px 10px 0 0; display: flex; flex-direction: column; padding: 8px 0 16px">
      <div style="display: flex; align-items: center; justify-content: space-between; padding: 0 8px 0 20px">
        <h2 style="margin: 0; font-family: 'Alfa Slab One', serif; font-weight: 400; font-size: 24px; text-transform: uppercase">Próximas</h2>
        <button aria-label="Cerrar cola" onClick="{{closeQueue}}" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg>
        </button>
      </div>
      <sc-for list="{{list}}" as="item" hint-placeholder-count="4">
        <button onClick="{{item.pick}}" style="display: flex; align-items: center; justify-content: space-between; min-height: 64px; padding: 0 20px; text-align: left; border-top: 2px dashed {{p.perf}}">
          <span style="font-size: 18px; font-weight: {{item.weight}}">{{item.title}}</span>
          <span style="font-size: 15px">{{item.artist}}</span>
        </button>
      </sc-for>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"paleta":{"editor":"enum","options":["Taquilla rosa","Verde función","Kraft","Azul platea","Amarillo palco","Lila"],"default":"Taquilla rosa"},"$preview":{"width":390,"height":844}}'>
const TRACKS = [
  { title: 'Luz de agosto', artist: 'Marea Alta', album: 'Costa norte', dur: 214, a: '#e4572e', b: '#f3c14b', c: '#17324d' },
  { title: 'Sal y cobre', artist: 'Los Faros', album: 'Puerto viejo', dur: 188, a: '#2a9d8f', b: '#e9c46a', c: '#143a3a' },
  { title: 'Última línea', artist: 'Noa Reyes', album: 'Sin parada', dur: 241, a: '#c1467e', b: '#f4a3b5', c: '#3a1737' },
  { title: 'Ruta once', artist: 'Marea Alta', album: 'Costa norte', dur: 203, a: '#4f7cff', b: '#a7c4ff', c: '#141f4d' },
];
const PALETTES = {
  'Taquilla rosa': { bg: '#2b1030', paper: '#ffc2d4', ink: '#2b1030', perf: '#8a4d68', faded: '#e897b1', fg: '#ffe9f0', ac: '#ffc2d4', stamp: '#b5123f' },
  'Verde función': { bg: '#0f2a22', paper: '#bfe8c4', ink: '#0f2a22', perf: '#4f7f60', faded: '#8fc79a', fg: '#e5f6e7', ac: '#bfe8c4', stamp: '#0b6b45' },
  'Kraft': { bg: '#1c1712', paper: '#d9b98a', ink: '#23180c', perf: '#7a5a34', faded: '#bb9764', fg: '#f3e6d0', ac: '#f0c27a', stamp: '#8f2414' },
  'Azul platea': { bg: '#0f1f4a', paper: '#bcd7ff', ink: '#0f1f4a', perf: '#4f6ea8', faded: '#8fb2e6', fg: '#e7f0ff', ac: '#bcd7ff', stamp: '#1a3fa8', dim: '#a9bfe6' },
  'Amarillo palco': { bg: '#2a2000', paper: '#ffd84d', ink: '#2a2000', perf: '#8c7420', faded: '#e3bb33', fg: '#fff5cf', ac: '#ffd84d', stamp: '#a81f18', dim: '#d9c98f' },
  'Lila': { bg: '#231238', paper: '#d9c2ff', ink: '#231238', perf: '#6f4fa0', faded: '#b799e6', fg: '#efe6ff', ac: '#d9c2ff', stamp: '#5c1a9c', dim: '#bfa9dc' },
};
const SLEEP = ['Dormir', '15 min', '30 min', '60 min'];
const RATES = [1, 1.25, 1.5, 2, 0.75];
const BARS = 44;
const CHANGE_FRAMES = 54;
const fmt = s => Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0');
const span = (value, from, to) => Math.max(0, Math.min(1, (value - from) / (to - from)));
const easeOut = value => 1 - Math.pow(1 - value, 3);
const easeIn = value => value * value * value;
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { i: 0, pos: 71, playing: true, change: 0, pending: null, shuffle: false, repeat: false, fav: false, queue: false, sleep: 0, rate: 0, eq: true };
  }
  componentDidMount() {
    this.timer = setInterval(() => {
      const s = this.state;
      if (s.change > 0) {
        const change = s.change - 1;
        const next = { change };
        if (change === Math.floor(CHANGE_FRAMES * 0.45) && s.pending !== null) {
          next.i = s.pending;
          next.pos = 0;
          next.pending = null;
        }
        this.setState(next);
        return;
      }
      if (!s.playing) return;
      const pos = s.pos + 0.033 * RATES[s.rate];
      if (pos >= TRACKS[s.i].dur) this.go(1); else this.setState({ pos });
    }, 33);
  }
  componentWillUnmount() { clearInterval(this.timer); }
  move(i) {
    this.setState({ change: CHANGE_FRAMES, pending: i, queue: false });
  }
  go(step) {
    this.move((this.state.i + step + TRACKS.length) % TRACKS.length);
  }
  renderVals() {
    const s = this.state;
    const t = TRACKS[s.i];
    const p = PALETTES[this.props.paleta ?? 'Taquilla rosa'] ?? PALETTES['Taquilla rosa'];
    const q = s.change > 0 ? 1 - s.change / CHANGE_FRAMES : 1;
    const fall = easeIn(span(q, 0, 0.3));
    const leave = easeIn(span(q, 0.28, 0.55));
    const enter = 1 - easeOut(span(q, 0.55, 0.82));
    const landed = q >= 0.55;
    const slam = span(q, 0.82, 0.94);
    const printed = (s.pos / t.dur) * BARS;
    return {
      t, p,
      ticketX: Math.round(q < 0.55 ? -420 * leave : 420 * enter),
      stubX: landed ? Math.round(420 * enter) : 0,
      stubY: landed ? 0 : Math.round(fall * 460),
      stubRot: landed ? 0 : Math.round(fall * 14),
      stampOpacity: q < 0.28 ? 0.92 * (1 - span(q, 0.2, 0.28)) : slam > 0 ? 0.92 : 0,
      stampScale: Math.round((2.3 - easeOut(slam) * 1.3) * 100) / 100,
      bars: Array.from({ length: BARS }, (_, index) => ({ w: 2 + ((index * 7 + s.i * 3) % 4), color: index < printed ? p.ink : p.faded })),
      number: s.i + 1,
      now: fmt(s.pos), left: fmt(t.dur - s.pos), total: fmt(t.dur),
      playing: s.playing, paused: !s.playing,
      playLabel: s.playing ? 'Pausar' : 'Reproducir',
      shuffle: s.shuffle, shuffleColor: s.shuffle ? p.ac : p.fg,
      repeat: s.repeat, repeatColor: s.repeat ? p.ac : p.fg,
      fav: s.fav, favColor: s.fav ? p.ac : p.fg, favFill: s.fav ? 'currentColor' : 'none',
      sleep: SLEEP[s.sleep], sleepColor: s.sleep ? p.ac : p.fg,
      rate: RATES[s.rate], rateColor: s.rate ? p.ac : p.fg,
      eqColor: s.eq ? p.ac : p.fg,
      queueOpen: s.queue,
      list: TRACKS.map((x, i) => ({ ...x, weight: i === s.i ? 700 : 400, pick: () => this.move(i) })),
      toggle: () => this.setState({ playing: !s.playing }),
      next: () => this.go(1),
      prev: () => (s.pos > 3 ? this.setState({ pos: 0 }) : this.go(-1)),
      toggleShuffle: () => this.setState({ shuffle: !s.shuffle }),
      toggleRepeat: () => this.setState({ repeat: !s.repeat }),
      toggleFav: () => this.setState({ fav: !s.fav }),
      openQueue: () => this.setState({ queue: true }),
      closeQueue: () => this.setState({ queue: false }),
      cycleSleep: () => this.setState({ sleep: (s.sleep + 1) % SLEEP.length }),
      cycleRate: () => this.setState({ rate: (s.rate + 1) % RATES.length }),
      toggleEq: () => this.setState({ eq: !s.eq }),
      seek: e => {
        const r = e.currentTarget.getBoundingClientRect();
        this.setState({ pos: Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)) * t.dur });
      },
    };
  }
}
</script>
</body>
</html>
